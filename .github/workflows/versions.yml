name: Версии

# Источник версий: versions.env (на чём проверено) и VERSION (установщик).
# В PR: проверка, что обложка README, README, index.html и install.sh совпадают с ними.
# В main: если что-то разошлось, workflow сам обновляет файлы и коммитит.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fonttools>=4.40"
      - name: Проверить версии
        if: github.event_name == 'pull_request'
        run: python3 tools/sync-versions.py --check
      - name: Обновить версии и закоммитить
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/sync-versions.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Версии: синхронизация с versions.env и VERSION"
          git push
